services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: punditrag-app
    env_file:
      - .env.docker
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    gpus: all
    ports:
      - "8000:8000"
    volumes:
      - ./temp-files:/app/temp-files
      - ./models:/app/models
      - ./cache/modelscope:/app/.cache/modelscope
      - ./cache/huggingface:/app/.cache/huggingface
    depends_on:
      milvus:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      mongo:
        condition: service_healthy
      create-minio-bucket:
        condition: service_completed_successfully
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: punditrag-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: punditrag-milvus-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data
    volumes:
      - milvus-minio-data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.5
    container_name: punditrag-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "19630:19530"
      - "9191:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    container_name: punditrag-neo4j
    environment:
      NEO4J_AUTH: neo4j/123123123
      NEO4J_dbms_security_auth__enabled: "true"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/var/lib/neo4j/import
      - neo4j-plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p 123123123 'RETURN 1'"]
      interval: 30s
      start_period: 60s
      timeout: 20s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: punditrag-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: punditrag
      MONGO_INITDB_ROOT_PASSWORD: "123123123"
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok", "-u", "punditrag", "-p", "123123123", "--authenticationDatabase", "admin"]
      interval: 30s
      start_period: 30s
      timeout: 20s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: punditrag-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /data --console-address ":9001"
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  create-minio-bucket:
    image: minio/mc:RELEASE.2023-03-20T17-17-53Z
    container_name: punditrag-create-minio-bucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done;
      mc mb --ignore-existing local/knowledge-base-files;
      exit 0;
      "

volumes:
  etcd-data:
  milvus-data:
  milvus-minio-data:
  mongo-data:
  neo4j-data:
  neo4j-import:
  neo4j-logs:
  neo4j-plugins:
  minio-data:
