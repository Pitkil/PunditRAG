[project]
name = "punditrag"
version = "0.1.0"
description = "A traceable Chinese RAG knowledge-base system with hybrid retrieval, reranking, citations, and reproducible evaluation."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "PunditRAG contributors" },
]
keywords = ["rag", "retrieval-augmented-generation", "langgraph", "milvus", "bge-m3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.13.0",
    "fastapi>=0.135.1",
    "flagembedding>=1.3.5",
    "huggingface-hub>=0.36.0",
    "langchain>=1.2.13",
    "langchain-core>=1.2.13",
    "langchain-openai>=1.1.11",
    "langchain-text-splitters>=1.1.1",
    "langgraph>=1.1.3",
    "loguru>=0.7.3",
    "minio>=7.2.20",
    "numpy>=2.4.3",
    "pymilvus[model]>=2.6.10",
    "pymongo>=4.16.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "uvicorn>=0.42.0",
    "openai-agents>=0.4.2",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "requests>=2.32.5",
    "starlette>=0.52.1",
    "typing-extensions>=4.15.0",
]
# Package index used by local uv commands.
[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
