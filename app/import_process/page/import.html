<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PunditRAG 知识库导入</title>
    <style>
        :root {
            --bg: #f5f7f4;
            --paper: rgba(255, 255, 255, 0.78);
            --paper-strong: #ffffff;
            --ink: #15201d;
            --muted: #62706b;
            --line: #d8dfd9;
            --line-strong: #b9c5bd;
            --brand: #0f766e;
            --brand-strong: #0b5f58;
            --brand-soft: #d9f2ed;
            --accent: #c98a16;
            --danger: #ba2d2d;
            --success: #24804f;
            --shadow: 0 24px 80px rgba(21, 32, 29, 0.12);
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--ink);
            font-family: "Noto Serif SC", "Source Han Serif SC", "Microsoft YaHei", "PingFang SC", serif;
            background:
                linear-gradient(120deg, rgba(15, 118, 110, 0.12), transparent 32%),
                linear-gradient(280deg, rgba(201, 138, 22, 0.16), transparent 34%),
                var(--bg);
            overflow-x: hidden;
        }

        body::before {
            position: fixed;
            inset: 0;
            z-index: -2;
            content: "";
            background-image:
                linear-gradient(rgba(21, 32, 29, 0.055) 1px, transparent 1px),
                linear-gradient(90deg, rgba(21, 32, 29, 0.055) 1px, transparent 1px);
            background-size: 28px 28px;
            mask-image: linear-gradient(to bottom, black, transparent 86%);
        }

        body::after {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            content: "";
            background-image: radial-gradient(rgba(21, 32, 29, 0.08) 0.8px, transparent 0.8px);
            background-size: 7px 7px;
            opacity: 0.35;
        }

        .shell {
            width: min(1180px, calc(100% - 40px));
            min-height: 100vh;
            margin: 0 auto;
            padding: 28px 0 40px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 0 28px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .brand-mark {
            display: grid;
            width: 42px;
            height: 42px;
            place-items: center;
            color: #fff;
            background: var(--ink);
            border-radius: var(--radius);
            box-shadow: inset 0 -8px 18px rgba(255, 255, 255, 0.14);
            font-family: "JetBrains Mono", Consolas, monospace;
            font-weight: 700;
        }

        .brand-title {
            margin: 0;
            font-size: 22px;
            line-height: 1;
            letter-spacing: 0;
        }

        .brand-subtitle {
            margin-top: 5px;
            color: var(--muted);
            font-size: 13px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 34px;
            padding: 0 13px;
            color: var(--brand-strong);
            background: rgba(217, 242, 237, 0.72);
            border: 1px solid rgba(15, 118, 110, 0.18);
            border-radius: 999px;
            font-size: 13px;
            white-space: nowrap;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--brand);
            border-radius: 50%;
            box-shadow: 0 0 0 5px rgba(15, 118, 110, 0.12);
        }

        .workspace {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 360px;
            gap: 24px;
            align-items: stretch;
        }

        .hero-panel {
            position: relative;
            display: grid;
            min-height: 650px;
            padding: 38px;
            overflow: hidden;
            background: var(--paper);
            border: 1px solid rgba(216, 223, 217, 0.95);
            border-radius: 14px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(22px);
        }

        .hero-panel::before {
            position: absolute;
            inset: 16px;
            content: "";
            pointer-events: none;
            border: 1px solid rgba(21, 32, 29, 0.08);
            border-radius: 10px;
        }

        .hero-copy {
            position: relative;
            z-index: 1;
            max-width: 680px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
            color: var(--brand-strong);
            font-family: Consolas, "JetBrains Mono", monospace;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .eyebrow::before {
            width: 28px;
            height: 1px;
            content: "";
            background: var(--brand);
        }

        h1 {
            max-width: 720px;
            margin: 0;
            font-size: clamp(42px, 7vw, 86px);
            line-height: 0.96;
            letter-spacing: 0;
        }

        .lead {
            max-width: 560px;
            margin: 22px 0 0;
            color: var(--muted);
            font-size: 18px;
            line-height: 1.8;
        }

        .drop-zone {
            position: relative;
            z-index: 1;
            display: grid;
            min-height: 290px;
            margin-top: 44px;
            padding: 30px;
            place-items: center;
            text-align: center;
            cursor: pointer;
            background:
                linear-gradient(145deg, rgba(255, 255, 255, 0.8), rgba(217, 242, 237, 0.46)),
                repeating-linear-gradient(135deg, transparent 0 16px, rgba(15, 118, 110, 0.035) 16px 18px);
            border: 1.5px dashed var(--line-strong);
            border-radius: 12px;
            transition: border-color 180ms ease, transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
        }

        .drop-zone:hover,
        .drop-zone.is-dragging {
            border-color: var(--brand);
            box-shadow: inset 0 0 0 1px rgba(15, 118, 110, 0.2), 0 18px 48px rgba(15, 118, 110, 0.14);
            transform: translateY(-2px);
        }

        .upload-symbol {
            display: grid;
            width: 78px;
            height: 78px;
            margin: 0 auto 22px;
            place-items: center;
            color: var(--brand-strong);
            background: #fff;
            border: 1px solid rgba(15, 118, 110, 0.22);
            border-radius: 50%;
            box-shadow: 0 16px 40px rgba(15, 118, 110, 0.13);
        }

        .upload-symbol svg {
            width: 34px;
            height: 34px;
        }

        .drop-title {
            margin: 0;
            font-size: 26px;
            font-weight: 800;
        }

        .drop-desc {
            margin: 10px 0 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.7;
        }

        .browse-text {
            color: var(--brand-strong);
            font-weight: 700;
        }

        .meta-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 22px;
        }

        .meta-tag {
            padding: 8px 10px;
            color: #46534f;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(216, 223, 217, 0.86);
            border-radius: 999px;
            font-family: Consolas, "JetBrains Mono", monospace;
            font-size: 12px;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .summary-card,
        .queue-card {
            background: rgba(255, 255, 255, 0.74);
            border: 1px solid rgba(216, 223, 217, 0.95);
            border-radius: 14px;
            box-shadow: 0 14px 44px rgba(21, 32, 29, 0.08);
            backdrop-filter: blur(20px);
        }

        .summary-card {
            padding: 22px;
        }

        .summary-title {
            margin: 0 0 14px;
            font-size: 18px;
        }

        .metric-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .metric {
            min-height: 82px;
            padding: 14px;
            background: #fff;
            border: 1px solid rgba(216, 223, 217, 0.9);
            border-radius: var(--radius);
        }

        .metric-value {
            display: block;
            font-family: Consolas, "JetBrains Mono", monospace;
            font-size: 24px;
            font-weight: 800;
        }

        .metric-label {
            display: block;
            margin-top: 7px;
            color: var(--muted);
            font-size: 13px;
        }

        .queue-card {
            min-height: 420px;
            overflow: hidden;
        }

        .queue-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 18px 18px 14px;
            border-bottom: 1px solid rgba(216, 223, 217, 0.9);
        }

        .queue-title {
            margin: 0;
            font-size: 18px;
        }

        .queue-count {
            color: var(--muted);
            font-family: Consolas, "JetBrains Mono", monospace;
            font-size: 12px;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            max-height: 540px;
            overflow-y: auto;
        }

        .empty-state {
            padding: 44px 24px;
            color: var(--muted);
            text-align: center;
            line-height: 1.7;
        }

        .file-item {
            padding: 16px 18px;
            background: rgba(255, 255, 255, 0.7);
            border-bottom: 1px solid rgba(216, 223, 217, 0.82);
            animation: itemIn 280ms ease both;
        }

        .file-main {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 14px;
        }

        .file-name {
            display: block;
            max-width: 220px;
            overflow: hidden;
            font-weight: 800;
            line-height: 1.35;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-size {
            display: block;
            margin-top: 6px;
            color: var(--muted);
            font-family: Consolas, "JetBrains Mono", monospace;
            font-size: 12px;
        }

        .badge {
            flex: 0 0 auto;
            min-width: 76px;
            padding: 7px 10px;
            color: var(--ink);
            background: #eef2ee;
            border: 1px solid var(--line);
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
            text-align: center;
        }

        .badge.uploading {
            color: #8a5a09;
            background: #fff3d8;
            border-color: #f1d9a2;
        }

        .badge.processing {
            color: var(--brand-strong);
            background: var(--brand-soft);
            border-color: rgba(15, 118, 110, 0.18);
        }

        .badge.completed {
            color: var(--success);
            background: #dff4e8;
            border-color: #bfe4cf;
        }

        .badge.failed {
            color: var(--danger);
            background: #ffe6e2;
            border-color: #f3b8ae;
        }

        .progress-track {
            height: 5px;
            margin-top: 14px;
            overflow: hidden;
            background: #e8eee9;
            border-radius: 999px;
        }

        .progress-bar {
            width: 0;
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--brand));
            border-radius: inherit;
            transition: width 260ms ease;
        }

        details {
            margin-top: 12px;
            color: var(--muted);
            font-size: 12px;
        }

        summary {
            cursor: pointer;
            user-select: none;
        }

        .log-list {
            display: grid;
            gap: 6px;
            margin: 10px 0 0;
            padding: 0;
            list-style: none;
        }

        .log-list li {
            padding: 8px 10px;
            background: rgba(245, 247, 244, 0.9);
            border: 1px solid rgba(216, 223, 217, 0.72);
            border-radius: 6px;
            line-height: 1.4;
        }

        input[type="file"] {
            display: none;
        }

        @keyframes itemIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 920px) {
            .workspace {
                grid-template-columns: 1fr;
            }

            .hero-panel {
                min-height: auto;
                padding: 28px;
            }

            .file-name {
                max-width: min(520px, 62vw);
            }
        }

        @media (max-width: 560px) {
            .shell {
                width: min(100% - 24px, 1180px);
                padding-top: 16px;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .hero-panel {
                padding: 22px;
                border-radius: 10px;
            }

            h1 {
                font-size: 42px;
            }

            .lead {
                font-size: 16px;
            }

            .drop-zone {
                min-height: 250px;
                padding: 22px;
            }

            .metric-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="shell">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark">PR</div>
                <div>
                    <h2 class="brand-title">PunditRAG</h2>
                    <div class="brand-subtitle">知识库导入与解析工作台</div>
                </div>
            </div>
            <div class="status-pill">
                <span class="status-dot"></span>
                <span>本地导入服务就绪</span>
            </div>
        </header>

        <section class="workspace">
            <div class="hero-panel">
                <div class="hero-copy">
                    <div class="eyebrow">Knowledge Import</div>
                    <h1>把文档送进知识库。</h1>
                    <p class="lead">上传 PDF 或 Markdown，PunditRAG 会自动完成解析、图片处理、切分、实体识别、向量化与入库流程。</p>
                </div>

                <label class="drop-zone" id="dropZone" for="fileInput">
                    <div>
                        <div class="upload-symbol" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none">
                                <path d="M12 15V4m0 0 4 4m-4-4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M5 14v3.5A2.5 2.5 0 0 0 7.5 20h9a2.5 2.5 0 0 0 2.5-2.5V14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <p class="drop-title">拖拽文件到这里</p>
                        <p class="drop-desc">或 <span class="browse-text">点击选择本地文件</span>，支持 PDF / MD 文档导入。</p>
                        <div class="meta-row">
                            <span class="meta-tag">PDF</span>
                            <span class="meta-tag">Markdown</span>
                            <span class="meta-tag">自动追踪节点</span>
                            <span class="meta-tag">本地服务 8000</span>
                        </div>
                    </div>
                </label>
                <input id="fileInput" type="file" multiple accept=".pdf,.md">
            </div>

            <aside class="side-panel">
                <div class="summary-card">
                    <h3 class="summary-title">导入概览</h3>
                    <div class="metric-grid">
                        <div class="metric">
                            <span class="metric-value" id="totalCount">0</span>
                            <span class="metric-label">提交文件</span>
                        </div>
                        <div class="metric">
                            <span class="metric-value" id="doneCount">0</span>
                            <span class="metric-label">完成任务</span>
                        </div>
                        <div class="metric">
                            <span class="metric-value" id="runningCount">0</span>
                            <span class="metric-label">处理中</span>
                        </div>
                        <div class="metric">
                            <span class="metric-value" id="failedCount">0</span>
                            <span class="metric-label">失败任务</span>
                        </div>
                    </div>
                </div>

                <div class="queue-card">
                    <div class="queue-head">
                        <h3 class="queue-title">任务队列</h3>
                        <span class="queue-count" id="queueCount">0 个文件</span>
                    </div>
                    <div class="file-list" id="fileList">
                        <div class="empty-state" id="emptyState">还没有上传任务。选择文件后，节点进度会显示在这里。</div>
                    </div>
                </div>
            </aside>
        </section>
    </main>

    <script>
        const API_BASE = window.location.protocol.startsWith("http") ? window.location.origin : "http://127.0.0.1:8000";
        const dropZone = document.getElementById("dropZone");
        const fileInput = document.getElementById("fileInput");
        const fileList = document.getElementById("fileList");
        const emptyState = document.getElementById("emptyState");
        const queueCount = document.getElementById("queueCount");
        const totalCount = document.getElementById("totalCount");
        const doneCount = document.getElementById("doneCount");
        const runningCount = document.getElementById("runningCount");
        const failedCount = document.getElementById("failedCount");

        const taskStats = {
            total: 0,
            done: 0,
            running: 0,
            failed: 0,
        };

        ["dragenter", "dragover"].forEach((eventName) => {
            dropZone.addEventListener(eventName, (event) => {
                event.preventDefault();
                dropZone.classList.add("is-dragging");
            });
        });

        ["dragleave", "drop"].forEach((eventName) => {
            dropZone.addEventListener(eventName, (event) => {
                event.preventDefault();
                dropZone.classList.remove("is-dragging");
            });
        });

        dropZone.addEventListener("drop", (event) => {
            handleFiles(event.dataTransfer.files);
        });

        fileInput.addEventListener("change", (event) => {
            handleFiles(event.target.files);
            fileInput.value = "";
        });

        function handleFiles(files) {
            const acceptedFiles = Array.from(files).filter((file) => {
                const name = file.name.toLowerCase();
                return name.endsWith(".pdf") || name.endsWith(".md");
            });

            acceptedFiles.forEach(uploadFile);
        }

        async function uploadFile(file) {
            emptyState?.remove();
            taskStats.total += 1;
            taskStats.running += 1;
            renderStats();

            const itemEl = createFileItem(file);
            fileList.prepend(itemEl);
            setProgress(itemEl, 12);

            const formData = new FormData();
            formData.append("files", file);

            try {
                const response = await fetch(`${API_BASE}/upload`, {
                    method: "POST",
                    body: formData,
                });

                if (!response.ok) {
                    throw new Error(`上传请求失败：${response.status}`);
                }

                const result = await response.json();
                const taskId = result.task_ids && result.task_ids[0];
                if (!taskId) {
                    throw new Error("后端未返回任务 ID");
                }

                updateBadge(itemEl, "processing", "处理中");
                setProgress(itemEl, 30);
                renderLogs(itemEl, [], ["文件已上传，等待导入流程启动"]);
                pollStatus(taskId, itemEl);
            } catch (error) {
                markFailed(itemEl, error.message || "上传失败");
            }
        }

        function createFileItem(file) {
            const itemEl = document.createElement("article");
            itemEl.className = "file-item";

            const mainEl = document.createElement("div");
            mainEl.className = "file-main";

            const infoEl = document.createElement("div");
            const fileNameEl = document.createElement("span");
            fileNameEl.className = "file-name";
            fileNameEl.textContent = file.name;

            const sizeEl = document.createElement("span");
            sizeEl.className = "file-size";
            sizeEl.textContent = formatSize(file.size);

            infoEl.append(fileNameEl, sizeEl);

            const badgeEl = document.createElement("span");
            badgeEl.className = "badge uploading";
            badgeEl.textContent = "上传中";

            mainEl.append(infoEl, badgeEl);

            const progressTrack = document.createElement("div");
            progressTrack.className = "progress-track";
            const progressBar = document.createElement("div");
            progressBar.className = "progress-bar";
            progressTrack.appendChild(progressBar);

            const detailsEl = document.createElement("details");
            const summaryEl = document.createElement("summary");
            summaryEl.textContent = "节点日志";
            const logListEl = document.createElement("ul");
            logListEl.className = "log-list";
            detailsEl.append(summaryEl, logListEl);

            itemEl.append(mainEl, progressTrack, detailsEl);
            return itemEl;
        }

        function pollStatus(taskId, itemEl) {
            const timer = setInterval(async () => {
                try {
                    const response = await fetch(`${API_BASE}/status/${taskId}`);
                    if (!response.ok) {
                        throw new Error(`状态查询失败：${response.status}`);
                    }

                    const data = await response.json();
                    const doneList = Array.isArray(data.done_list) ? data.done_list : [];
                    const runningList = Array.isArray(data.running_list) ? data.running_list : [];
                    renderLogs(itemEl, doneList, runningList);

                    if (data.status === "completed") {
                        clearInterval(timer);
                        updateBadge(itemEl, "completed", "已完成");
                        setProgress(itemEl, 100);
                        taskStats.running -= 1;
                        taskStats.done += 1;
                        renderStats();
                        return;
                    }

                    if (data.status === "failed") {
                        clearInterval(timer);
                        markFailed(itemEl, "导入流程失败，请查看后端日志");
                        return;
                    }

                    updateBadge(itemEl, "processing", "处理中");
                    setProgress(itemEl, progressByDone(doneList.length));
                } catch (error) {
                    clearInterval(timer);
                    markFailed(itemEl, error.message || "状态查询失败");
                }
            }, 1800);
        }

        function markFailed(itemEl, message) {
            updateBadge(itemEl, "failed", "失败");
            setProgress(itemEl, 100);
            renderLogs(itemEl, [], [message]);
            taskStats.running = Math.max(0, taskStats.running - 1);
            taskStats.failed += 1;
            renderStats();
        }

        function renderLogs(itemEl, doneList, runningList) {
            const summaryEl = itemEl.querySelector("summary");
            const logListEl = itemEl.querySelector(".log-list");
            logListEl.innerHTML = "";

            const done = doneList.map((text) => `${text} 已完成`);
            const running = runningList.map((text) => `正在执行 ${text}`);
            const lines = [...done, ...running];

            summaryEl.textContent = `节点日志：完成 ${done.length}，进行中 ${running.length}`;

            if (lines.length === 0) {
                const li = document.createElement("li");
                li.textContent = "等待后端返回节点状态";
                logListEl.appendChild(li);
                return;
            }

            lines.forEach((line) => {
                const li = document.createElement("li");
                li.textContent = line;
                logListEl.appendChild(li);
            });
        }

        function progressByDone(doneLength) {
            const base = 30;
            const step = 10;
            return Math.min(92, base + doneLength * step);
        }

        function updateBadge(itemEl, className, text) {
            const badgeEl = itemEl.querySelector(".badge");
            badgeEl.className = `badge ${className}`;
            badgeEl.textContent = text;
        }

        function setProgress(itemEl, value) {
            itemEl.querySelector(".progress-bar").style.width = `${value}%`;
        }

        function renderStats() {
            totalCount.textContent = String(taskStats.total);
            doneCount.textContent = String(taskStats.done);
            runningCount.textContent = String(Math.max(0, taskStats.running));
            failedCount.textContent = String(taskStats.failed);
            queueCount.textContent = `${taskStats.total} 个文件`;
        }

        function formatSize(bytes) {
            if (bytes >= 1024 * 1024) {
                return `${(bytes / 1024 / 1024).toFixed(2)} MB`;
            }
            return `${(bytes / 1024).toFixed(1)} KB`;
        }
    </script>
</body>
</html>
