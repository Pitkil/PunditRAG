name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regression:
    name: Offline regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_DEFAULT_INDEX: https://pypi.org/simple
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.5"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --no-dev --no-install-project

      - name: Compile Python sources
        run: uv run --no-sync python -m compileall -q app eval test

      - name: Run deterministic regression suite
        shell: bash
        run: |
          set -euo pipefail
          for test_file in \
            test/16_node_rerank.py \
            test/17_text_compress_utils.py \
            test/18_node_answer_output.py \
            test/19_workspace_features.py \
            test/20_rag_reliability.py \
            test/21_reliability_hardening.py
          do
            uv run --no-sync python "$test_file"
          done

  dockerfile-check:
    name: Dockerfile check
    needs: offline-regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Dockerfile
        run: docker buildx build --check .

  docker-build:
    name: Docker build
    needs: dockerfile-check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
